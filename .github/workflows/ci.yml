name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificação completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: npm run check
        run: npm run check

      # A matriz de doze por doze em versão de fumaça: uma partida por
      # configuração, 156 configurações. Ela falha o job se aparecer comando
      # ilegal ou invariante quebrada.
      - name: Matriz 12x12 (fumaça)
        run: npm run simulate:matrix:smoke -- --seed ci-smoke
