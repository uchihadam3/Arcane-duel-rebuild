name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Estas três são as permissões que o deploy oficial do Pages exige. Em
# particular `id-token: write`: é o OIDC que autentica o artefato perante o
# serviço do Pages. Sem ele, `deploy-pages` falha.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez, e sem cancelar um que já começou.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir o cliente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar o Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Garante que a origem do Pages seja "GitHub Actions". Foi
          # exatamente a divergência entre a origem configurada e o método de
          # publicação que deixou o site público parado por dias.
          enablement: true

      - name: Construir
        run: npm run build
        env:
          # O prefixo é escrito aqui, e não lido de `steps.pages.outputs`, por
          # uma razão prática: este valor é o que já provou produzir
          # `/Arcane-duel-rebuild/` no bundle publicado, com barra final
          # garantida. `normalizarBase` aceitaria as duas formas, mas o build
          # do site no ar não é lugar para depender de um detalhe de formato.
          BASE_PATH: /${{ github.event.repository.name }}/
          # O commit e o número da execução viram o que a tela de status
          # mostra. Ambos existem no ambiente do Actions; ficam explícitos para
          # que a dependência seja visível e verificável.
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Preparar o site
        run: |
          # O Pages não tem reescrita de rota: servir o mesmo documento em
          # 404.html faz /login, /builds, /match e /profile abrirem o cliente.
          # Um asset que falta continua devolvendo status 404, que é o correto.
          cp apps/web/dist/index.html apps/web/dist/404.html
          # Redundante no caminho do artefato, que não passa pelo Jekyll, e
          # barato: protege o site se a origem do Pages algum dia voltar a ser
          # uma branch.
          touch apps/web/dist/.nojekyll

      - name: Conferir o artefato antes de publicar
        run: node scripts/verificar-artefato-publicado.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    # O deployment de verdade acontece aqui. Enquanto este job não terminar
    # verde, o endereço público continua servindo a versão anterior — por mais
    # verde que o job de build esteja.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
